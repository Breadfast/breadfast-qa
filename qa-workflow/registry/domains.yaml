# QA domains & index registry (seed).
# Migrates into breadfast-workflow/registry/domains.yaml.
# Domain rules are NOT split per-domain in docs/ai/business yet (overview/rules/products/roles);
# domain-splitting is a follow-up. Wrappers currently reference the shared business docs.

schemaVersion: 1

domains:
  card:
    version: "1.0"
    description: Card perks, partners, regulations, security, card services
    sources:
      - docs/ai/business/business-rules.md
      - docs/ai/business/products.md
  payment:
    version: "1.0"
    description: Breadfast Pay flows, funding, transactions
    sources:
      - docs/ai/business/business-rules.md
      - docs/ai/business/products.md
  marketing:
    version: "1.0"
    description: Perks marketing, sections, mobile display, copy/localization
    sources:
      - docs/ai/business/products.md

workflows:
  - id: qa-shift-left
    file: workflows/qa-shift-left.md
  - id: qa-implementation-validation
    file: workflows/qa-implementation-validation.md
  # qa-full is a COMPOSITION of the two above (no phases of its own); it replaces W2's
  # Reconcile with a continuity assertion. Phase skills are unchanged — hence `composes`.
  - id: qa-full
    file: workflows/qa-full.md
    composes: [qa-shift-left, qa-implementation-validation]

skills:
  # phase task skills (thin wrappers over docs/ai/**)
  # `workflow:` lists the DEFINING workflow(s); qa-full inherits every skill via `composes` above.
  - { id: story-analysis,      runsAs: subagent, workflow: qa-shift-left }
  - { id: figma-analysis,      runsAs: subagent, workflow: qa-shift-left }
  - { id: impact-analysis,     runsAs: subagent, workflow: qa-shift-left }
  # test-design: Phase A (HLS) + Phase B (test cases) are shift-left; Phase C (reconciliation) is validation.
  - { id: test-design,         runsAs: subagent, workflow: [qa-shift-left, qa-implementation-validation] }
  # the mandatory review gate between generating cases and importing them (2026-08-09)
  - { id: testcase-review,     runsAs: subagent, workflow: qa-shift-left }
  # Mode A = pre-development exploratory ANALYSIS (conditional); Mode B = post-development exploratory TESTING
  - { id: exploratory-testing, runsAs: inline,   workflow: [qa-shift-left, qa-implementation-validation] }
  - { id: visual-testing,      runsAs: subagent, workflow: qa-implementation-validation }
  # Mode A = import the approved cases (shift-left); Mode B = sync validation-time deltas
  - { id: browserstack-mgmt,   runsAs: inline,   workflow: [qa-shift-left, qa-implementation-validation] }
  - { id: automation-gen,      runsAs: subagent, workflow: qa-implementation-validation }
  - { id: framework-conformance, runsAs: subagent, workflow: qa-implementation-validation }
  - { id: defect-reporting,    runsAs: inline,   workflow: qa-implementation-validation }
  # clarification is the existing grill-me skill (inline, interactive) — not re-authored here
